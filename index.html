<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SOUL — Your Time. Your Life.</title>
    <meta name="description" content="Your personal AI operating system for student life." />
    <meta name="theme-color" content="#080C0D" />
    <meta name="background-color" content="#080C0D" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SOUL" />
    <meta name="application-name" content="SOUL" />
    <meta name="format-detection" content="telephone=no" />

    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800;900&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#080C0D] text-[#e8f0f2] antialiased selection:bg-cyan-400 selection:text-black overscroll-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('SOUL ServiceWorker active:', reg.scope))
            .catch((err) => console.warn('SOUL ServiceWorker error:', err));
        });
      }
    </script>
  </body>
</html>

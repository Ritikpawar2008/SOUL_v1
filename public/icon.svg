<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060A0B"/>
      <stop offset="50%" stop-color="#0C1417"/>
      <stop offset="100%" stop-color="#040708"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#22d3ee" stroke-opacity="0.25" stroke-width="3" />

  <!-- Abstract Time/Balance Outer Rings -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="142" fill="none" stroke="#22d3ee" stroke-opacity="0.12" stroke-width="2" />

  <!-- Outer Kinetic Diamond (Growth & Balance) -->
  <polygon points="256,76 396,256 256,436 116,256" fill="none" stroke="url(#cyanGlow)" stroke-width="10" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Inner Dynamic Orbit Path (Intelligence & Student Energy) -->
  <path d="M 160 256 C 160 170, 352 170, 352 256 C 352 342, 160 342, 160 256 Z" 
        fill="none" 
        stroke="url(#orbitGrad)" 
        stroke-width="7" 
        stroke-linecap="round" 
        transform="rotate(-35 256 256)" />

  <!-- Central Nexus Core (SOUL AI Intelligence) -->
  <circle cx="256" cy="256" r="28" fill="#080C0D" stroke="#ffffff" stroke-width="6" />
  <circle cx="256" cy="256" r="14" fill="#22d3ee" filter="url(#glow)" />

  <!-- Cardinal Balance Micro Markers -->
  <circle cx="256" cy="94" r="5" fill="#22d3ee" />
  <circle cx="256" cy="418" r="5" fill="#22d3ee" />
  <circle cx="134" cy="256" r="5" fill="#22d3ee" />
  <circle cx="378" cy="256" r="5" fill="#f97316" />

  <!-- Geometric Upward Growth Apex -->
  <polyline points="226,206 256,176 286,206" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
